name: Rebuild live streams

on:
  schedule:
    - cron: "0 6 * * *"          # daily at 06:00 UTC
  workflow_dispatch:              # allow running it by hand

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl and build streams.json
        run: python3 src/pipeline.py

      - name: Commit only if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json data/index.json data/inventory.json data/unresolved.json data/geo_cache.json
          git diff --staged --quiet || git commit -m "rebuild streams.json"
          git push
